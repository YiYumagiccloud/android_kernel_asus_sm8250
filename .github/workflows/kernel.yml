name: Build ROG Phone 3 Kernel (lineage-23.0)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex git \
            build-essential \
            libssl-dev \
            libncurses-dev \
            libelf-dev \
            dwarves \
            python3 \
            ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ github.ref }}
          restore-keys: |
            kernel-ccache-

      - name: Download AOSP Clang (prebuilt)
        run: |
          mkdir -p toolchains
          cd toolchains
      
          CLANG_VERSION=clang-r536225
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz
      
          mkdir clang
          tar -xf ${CLANG_VERSION}.tar.gz -C clang

      - name: Set build environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CCACHE=ccache" >> $GITHUB_ENV
          echo "PATH=$PWD/toolchains/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Kernel defconfig (kona + obiwan)
        run: |
          make vendor/kona_defconfig
          scripts/kconfig/merge_config.sh \
            arch/arm64/configs/vendor/kona_defconfig \
            arch/arm64/configs/vendor/asus/obiwan.config

      - name: Build kernel
        run: |
          make -j$(nproc)

      - name: Package artifacts
        run: |
          mkdir -p out-artifacts
          cp -v arch/arm64/boot/Image* out-artifacts/ || true
          cp -v arch/arm64/boot/dts/qcom/*.dtb out-artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ROG-Phone-3-kernel
          path: out-artifacts
