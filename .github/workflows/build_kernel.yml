name: 构建ASUS ROG Phone 3内核（正确工具链）

on:
  push:
    branches: [ lineage-23.0 ]
  pull_request:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检查仓库代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 设置编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex gcc-multilib \
          g++-multilib git gnupg gperf imagemagick lib32ncurses-dev \
          lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc \
          zip zlib1g-dev python3 python3-pip unzip wget libncurses-dev bzip2
        pip3 install --user pycryptodome

    - name: 下载AOSP工具链
      run: |
        echo "=== 下载AOSP预构建工具链 ==="
        
        # 创建工具链目录
        mkdir -p ${{ github.workspace }}/toolchains
        
        # 下载Clang（使用较旧版本）
        echo "下载Clang 12.0.5..."
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r41/clang-r450784d.tar.gz
        mkdir -p ${{ github.workspace }}/toolchains/clang
        tar -xzf clang-r450784d.tar.gz -C ${{ github.workspace }}/toolchains/clang
        rm clang-r450784d.tar.gz
        
        # 下载GCC交叉编译器（必须！）
        echo "下载AArch64 GCC 4.9交叉编译器..."
        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.0.0_r41.tar.gz
        mkdir -p ${{ github.workspace }}/toolchains/gcc/aarch64-linux-android-4.9
        tar -xzf android-12.0.0_r41.tar.gz -C ${{ github.workspace }}/toolchains/gcc/aarch64-linux-android-4.9
        rm android-12.0.0_r41.tar.gz
        
        # 下载32位ARM GCC交叉编译器
        echo "下载ARM GCC 4.9交叉编译器..."
        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.0.0_r41.tar.gz
        mkdir -p ${{ github.workspace }}/toolchains/gcc/arm-linux-androideabi-4.9
        tar -xzf android-12.0.0_r41.tar.gz -C ${{ github.workspace }}/toolchains/gcc/arm-linux-androideabi-4.9
        rm android-12.0.0_r41.tar.gz
        
        echo "✅ 工具链下载完成"

    - name: 修复wakeup.c包含路径
      run: |
        echo "=== 修复wakeup.c包含路径 ==="
        cd ${{ github.workspace }}
        
        if [ -f "drivers/base/power/wakeup.c" ]; then
          echo "修复包含路径..."
          sed -i 's|#include <../../extcon/extcon.h>|#include "../../../extcon/extcon.h"|' drivers/base/power/wakeup.c
          echo "✅ 修复完成"
        fi

    - name: 配置内核（使用GCC）
      run: |
        cd ${{ github.workspace }}
        echo "=== 配置内核 ==="
        
        # 清理
        make clean 2>/dev/null || true
        rm -f .config
        
        # 设置工具链路径
        export PATH=${{ github.workspace }}/toolchains/clang/bin:$PATH
        export PATH=${{ github.workspace }}/toolchains/gcc/aarch64-linux-android-4.9/bin:$PATH
        export PATH=${{ github.workspace }}/toolchains/gcc/arm-linux-androideabi-4.9/bin:$PATH
        
        # 使用GCC交叉编译器
        echo "应用配置..."
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- vendor/kona_defconfig
        
        # 合并设备配置
        if [ -f "arch/arm64/configs/vendor/asus/obiwan.config" ]; then
          echo "合并obiwan.config..."
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/asus/obiwan.config
        fi
        
        # 生成最终配置
        echo "生成最终配置..."
        yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- oldconfig 2>&1 | tail -30

    - name: 编译内核（使用GCC）
      timeout-minutes: 50
      env:
        ARCH: arm64
        SUBARCH: arm64
      run: |
        cd ${{ github.workspace }}
        echo "=== 开始编译内核 ==="
        
        # 设置工具链路径
        export PATH=${{ github.workspace }}/toolchains/clang/bin:$PATH
        export PATH=${{ github.workspace }}/toolchains/gcc/aarch64-linux-android-4.9/bin:$PATH
        export PATH=${{ github.workspace }}/toolchains/gcc/arm-linux-androideabi-4.9/bin:$PATH
        
        # 显示工具链版本
        echo "工具链版本:"
        aarch64-linux-android-gcc --version | head -3
        clang --version | head -3
        
        # 使用传统GCC编译
        echo "开始编译（使用GCC交叉编译器）..."
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- -j$(($(nproc) * 2)) 2>&1 | tee build.log
        
        echo "=== 编译结果检查 ==="
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "🎉 编译成功！"
          echo "内核文件: arch/arm64/boot/Image.gz"
          ls -lh arch/arm64/boot/Image.gz
          
          # 检查模块
          MOD_COUNT=$(find . -name "*.ko" -type f 2>/dev/null | wc -l)
          echo "生成的模块数量: $MOD_COUNT"
          
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "🎉 编译成功！"
          echo "内核文件: arch/arm64/boot/Image"
          ls -lh arch/arm64/boot/Image
        else
          echo "❌ 编译失败"
          echo "查看错误日志:"
          tail -100 build.log | grep -B5 -A5 "error\|Error\|fatal"
          exit 1
        fi

    - name: 打包内核
      if: success()
      run: |
        cd ${{ github.workspace }}
        BUILD_DATE=$(date +"%Y%m%d-%H%M")
        OUTPUT_DIR="kernel-gcc-$BUILD_DATE"
        mkdir -p $OUTPUT_DIR
        
        # 复制内核文件
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          cp arch/arm64/boot/Image.gz $OUTPUT_DIR/
          echo "✅ 复制: Image.gz"
        elif [ -f "arch/arm64/boot/Image" ]; then
          cp arch/arm64/boot/Image $OUTPUT_DIR/
          echo "✅ 复制: Image"
        fi
        
        # 复制模块
        if find . -name "*.ko" -type f 2>/dev/null | head -1 > /dev/null; then
          mkdir -p $OUTPUT_DIR/modules
          find . -name "*.ko" -type f -exec cp {} $OUTPUT_DIR/modules/ \;
          echo "✅ 复制模块文件"
        fi
        
        # 打包
        tar -czf $OUTPUT_DIR.tar.gz $OUTPUT_DIR/
        echo "🎉 打包完成: $OUTPUT_DIR.tar.gz"

    - name: 上传构建产物
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-gcc-build-${{ github.run_number }}
        path: ${{ github.workspace }}/*.tar.gz
        retention-days: 30
