name: 构建ASUS ROG Phone 3内核（精简调试版）

on:
  push:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: 检查仓库代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 设置最小化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc build-essential ccache libncurses-dev libssl-dev \
          flex bison libelf-dev git make gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi python3
        sudo ln -sf /usr/bin/python3 /usr/bin/python2

    - name: 修复wakeup.c包含路径
      run: |
        cd ${{ github.workspace }}
        if [ -f "drivers/base/power/wakeup.c" ]; then
          sed -i 's|#include <../../extcon/extcon.h>|#include "../../../extcon/extcon.h"|' drivers/base/power/wakeup.c
          echo "修复后的第26行:"
          sed -n '26p' drivers/base/power/wakeup.c
        fi

    - name: 简单配置内核
      run: |
        cd ${{ github.workspace }}
        
        # 完全清理
        make clean 2>/dev/null || true
        make mrproper 2>/dev/null || true
        rm -f .config
        
        # 简单复制配置文件
        cp arch/arm64/configs/vendor/kona_defconfig .config
        echo "✅ 复制kona_defconfig"
        
        # 合并设备配置（如果存在）
        if [ -f "arch/arm64/configs/vendor/asus/obiwan.config" ]; then
          cat arch/arm64/configs/vendor/asus/obiwan.config >> .config
          echo "✅ 追加obiwan.config"
        fi
        
        # 去重配置
        sort -u .config > .config.tmp && mv .config.tmp .config
        echo "配置行数: $(wc -l < .config)"

    - name: 编译并捕获完整错误
      timeout-minutes: 60
      run: |
        cd ${{ github.workspace }}
        echo "=== 开始编译 ==="
        
        # 保存完整编译日志
        {
          echo "编译开始时间: $(date)"
          echo "编译器信息:"
          aarch64-linux-gnu-gcc --version
          echo ""
          
          # 第一步：生成头文件
          echo "=== 生成头文件 ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare 2>&1
          echo "准备步骤退出码: $?"
          echo ""
          
          # 第二步：编译内核
          echo "=== 编译内核 ==="
          time make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 2>&1
          echo "编译退出码: $?"
          
          echo "编译结束时间: $(date)"
        } | tee full_build.log
        
        # 检查结果
        if [ -f "arch/arm64/boot/Image.gz" ] || [ -f "arch/arm64/boot/Image" ]; then
          echo "✅ 编译成功！"
          ls -lh arch/arm64/boot/
        else
          echo "❌ 编译失败"
          
          # 提取关键错误信息
          echo "=== 错误摘要 ==="
          grep -n -B2 -A2 "error\|Error\|ERROR\|fatal\|undefined" full_build.log | head -50
          
          echo ""
          echo "=== 最后50行 ==="
          tail -50 full_build.log
          
          # 保存错误日志供下载
          cp full_build.log error.log
          exit 1
        fi

    - name: 上传完整编译日志
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log-${{ github.run_number }}
        path: |
          ${{ github.workspace }}/full_build.log
          ${{ github.workspace }}/.config
        retention-days: 15

    - name: 打包内核
      if: success()
      run: |
        cd ${{ github.workspace }}
        mkdir -p output
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          cp arch/arm64/boot/Image.gz output/
        elif [ -f "arch/arm64/boot/Image" ]; then
          cp arch/arm64/boot/Image output/
        fi
        cp .config output/
        tar -czf kernel-output.tar.gz output/
        echo "✅ 打包完成"

    - name: 上传成功产物
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-success-${{ github.run_number }}
        path: ${{ github.workspace }}/kernel-output.tar.gz
        retention-days: 30
