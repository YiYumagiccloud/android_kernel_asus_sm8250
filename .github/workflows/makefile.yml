# A simple action usage
name: Build Kernel
on:
  workflow_dispatch: # 允许手动触发

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写权限，否则无法发布 Release

    steps:
          - name: Build Kernel
            uses: dabao1955/kernel_build_action@main
            with:
              kernel-url: https://github.com/Rocky7842/android_kernel_asus_sm8250
              kernel-branch: lineage-23.0
              config: vendor/kona-perf_defconfig
              arch: arm64
              aosp-gcc: true
              aosp-clang: true
              android-version: 12
              # 关键修正：添加 -Wno-error 来禁止警告转错误
              # 同时尝试通过 KCFLAGS 定义缺失的变量为 0 (假)，以跳过代码逻辑
              extra-make-args: |
                LLVM=1 
                LLVM_IAS=1 
                KCFLAGS="-w -Dg_station_pm_suspend=0" 
                KCPPFLAGS="-w"
              disable-lto: true
              anykernel3: true
              release: true
