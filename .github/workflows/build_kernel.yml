name: 构建ASUS ROG Phone 3内核（最终版）

on:
  push:
    branches: [ lineage-23.0 ]
  pull_request:
    branches: [ lineage-23.0 ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'obiwan'
        type: choice
        options:
          - obiwan
          - kona

env:
  KERNEL_NAME: "ASUS_ROG_Phone_3_SM8250"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检查仓库代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 设置编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex gcc-multilib \
          g++-multilib git gnupg gperf imagemagick lib32ncurses-dev \
          lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc \
          zip zlib1g-dev python3 python3-pip unzip wget libncurses-dev bzip2
        pip3 install --user pycryptodome

    - name: 下载编译工具链
      run: |
        echo "=== 下载编译工具链 ==="
        
        # 下载Android NDK
        echo "下载Android NDK r26b..."
        wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        mv android-ndk-r26b ndk
        
        echo "工具链版本:"
        ${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version | head -3

    - name: 设置环境变量
      run: |
        echo "设置编译环境变量..."
        
        NDK_PATH="${{ github.workspace }}/ndk"
        CLANG_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
        
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "PATH=$CLANG_PATH:$PATH" >> $GITHUB_ENV
        
        # 使用LLVM工具链
        echo "CC=clang" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-android21-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=armv7a-linux-androideabi21-" >> $GITHUB_ENV
        
        # 启用LLVM
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: 配置内核
      run: |
        cd ${{ github.workspace }}
        echo "=== 配置内核 ==="
        
        # 清理
        make clean 2>/dev/null || true
        rm -f .config
        
        # 使用基础配置
        echo "应用kona_defconfig..."
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/kona_defconfig
        
        # 合并设备配置
        if [ -f "arch/arm64/configs/vendor/asus/obiwan.config" ]; then
          echo "合并obiwan.config..."
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/asus/obiwan.config
          echo "✅ 配置合并完成"
        fi

    - name: 检查和修复配置
      run: |
        cd ${{ github.workspace }}
        echo "=== 检查和修复配置 ==="
        
        # 检查extcon配置
        echo "当前extcon配置:"
        grep -E "CONFIG_EXTCON" .config || echo "extcon配置未找到"
        
        # 确保extcon启用
        if grep -q "CONFIG_EXTCON=y" .config; then
          echo "✅ CONFIG_EXTCON已启用"
        else
          echo "启用CONFIG_EXTCON..."
          ./scripts/config --enable CONFIG_EXTCON
        fi
        
        # 检查重要的ASUS配置
        echo "检查ASUS相关配置:"
        grep -E "CONFIG_MACH_ASUS|CONFIG_ASUS_" .config | head -10
        
        # 检查驱动配置
        echo "检查驱动配置:"
        grep -E "CONFIG_TOUCHSCREEN_GOODIX|CONFIG_QCA_CLD_WLAN|CONFIG_CNSS_QCA6390" .config

    - name: 生成最终配置
      run: |
        cd ${{ github.workspace }}
        echo "=== 生成最终配置 ==="
        
        echo "运行oldconfig（非交互式）..."
        # 使用for循环生成空行
        for i in $(seq 1 20); do
          echo ""
        done | make ARCH=arm64 LLVM=1 LLVM_IAS=1 oldconfig 2>&1 | tail -100
        
        echo "配置摘要:"
        echo "1. extcon配置:"
        grep -E "CONFIG_EXTCON" .config || echo "未找到"
        
        echo "2. 关键驱动配置:"
        grep -E "CONFIG_MACH_ASUS_ZS661KS|CONFIG_TOUCHSCREEN_GOODIX_GTX8_STATION|CONFIG_LTO_CLANG" .config || echo "未找到"

    - name: 编译内核
      timeout-minutes: 40
      env:
        ARCH: arm64
        SUBARCH: arm64
      run: |
        cd ${{ github.workspace }}
        echo "=== 开始编译内核 ==="
        
        # 清理输出目录
        rm -rf out 2>/dev/null || true
        
        echo "编译配置检查:"
        echo "1. 检查extcon.h文件:"
        if [ -f "drivers/extcon/extcon.h" ]; then
          echo "✅ drivers/extcon/extcon.h 存在"
          # 检查wakeup.c中的包含路径
          if grep -q '../../../extcon/extcon.h' drivers/base/power/wakeup.c; then
            echo "✅ wakeup.c包含路径正确"
          else
            echo "❌ wakeup.c包含路径错误"
            head -30 drivers/base/power/wakeup.c | grep -n "extcon"
          fi
        else
          echo "❌ 错误：找不到extcon.h"
          find . -name "extcon.h" -type f
        fi
        
        echo "2. 开始编译..."
        # 使用更稳健的编译命令
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(($(nproc) * 2)) 2>&1 | tee build.log
        
        # 检查编译结果
        echo "=== 编译结果检查 ==="
        
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "🎉 编译成功！"
          echo "内核文件: arch/arm64/boot/Image.gz"
          ls -lh arch/arm64/boot/Image.gz
          
          # 检查模块
          MOD_COUNT=$(find . -name "*.ko" -type f 2>/dev/null | wc -l)
          echo "生成的模块数量: $MOD_COUNT"
          
          if [ $MOD_COUNT -gt 0 ]; then
            echo "前5个模块:"
            find . -name "*.ko" -type f 2>/dev/null | head -5
          fi
          
          # 检查是否生成extcon模块
          echo "extcon相关模块:"
          find . -name "*extcon*.ko" -type f 2>/dev/null || echo "未找到extcon模块"
          
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "🎉 编译成功！"
          echo "内核文件: arch/arm64/boot/Image"
          ls -lh arch/arm64/boot/Image
        else
          echo "❌ 编译失败"
          echo "查看错误日志最后100行:"
          tail -100 build.log | grep -B3 -A3 "error\|Error\|ERROR\|fatal"
          
          echo "检查常见问题:"
          # 检查extcon编译状态
          if grep -q "CONFIG_EXTCON=y" .config; then
            echo "✅ CONFIG_EXTCON在配置中启用"
          else
            echo "❌ CONFIG_EXTCON未启用"
          fi
          
          # 检查是否有未定义的符号
          echo "检查未定义符号:"
          tail -200 build.log | grep -i "undefined reference" | head -10
          
          exit 1
        fi

    - name: 打包内核
      if: success()
      run: |
        cd ${{ github.workspace }}
        echo "=== 打包内核文件 ==="
        
        BUILD_DATE=$(date +"%Y%m%d-%H%M")
        OUTPUT_DIR="kernel-asm-${BUILD_DATE}"
        mkdir -p $OUTPUT_DIR
        
        # 复制内核映像
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          cp arch/arm64/boot/Image.gz $OUTPUT_DIR/
          KERNEL_FILE="Image.gz"
          echo "✅ 复制: Image.gz"
        elif [ -f "arch/arm64/boot/Image" ]; then
          cp arch/arm64/boot/Image $OUTPUT_DIR/
          KERNEL_FILE="Image"
          echo "✅ 复制: Image"
        fi
        
        # 复制DTB文件
        DTB_COUNT=0
        if find arch/arm64/boot/dts -name "*.dtb" -type f 2>/dev/null | head -1 > /dev/null; then
          mkdir -p $OUTPUT_DIR/dtb
          find arch/arm64/boot/dts -name "*.dtb" -type f -exec cp {} $OUTPUT_DIR/dtb/ \;
          DTB_COUNT=$(ls $OUTPUT_DIR/dtb/*.dtb 2>/dev/null | wc -l)
          echo "✅ 复制 $DTB_COUNT 个DTB文件"
        fi
        
        # 复制模块
        MOD_COUNT=$(find . -name "*.ko" -type f 2>/dev/null | wc -l)
        if [ $MOD_COUNT -gt 0 ]; then
          mkdir -p $OUTPUT_DIR/modules
          find . -name "*.ko" -type f -exec cp {} $OUTPUT_DIR/modules/ \;
          echo "✅ 复制 $MOD_COUNT 个模块文件"
        fi
        
        # 复制配置文件
        cp .config $OUTPUT_DIR/config
        echo "✅ 复制配置文件"
        
        # 复制编译日志
        cp build.log $OUTPUT_DIR/ 2>/dev/null || true
        
        # 获取提交ID前8位
        COMMIT_SHORT=$(git rev-parse --short=8 HEAD 2>/dev/null || echo "${{ github.sha }}" | cut -c1-8)
        
        # 创建构建信息
        cat > $OUTPUT_DIR/build-info.txt << EOF
        ========================================
        ASUS ROG Phone 3 内核构建信息
        ========================================
        设备型号: ASUS_I003D (ROG Phone 3)
        设备代号: obiwan
        芯片平台: kona (SM8250)
        
        内核文件: $KERNEL_FILE
        构建时间: $BUILD_DATE
        工具链: Android NDK r26b + Clang
        
        配置来源:
          - kona_defconfig (SM8250基础配置)
          - obiwan.config (ASUS ROG Phone 3专用配置)
        
        文件统计:
          - 内核映像: 1个
          - DTB文件: ${DTB_COUNT}个
          - 内核模块: $MOD_COUNT个
        
        仓库信息:
          仓库: ${{ github.repository }}
          分支: ${{ github.ref_name }}
          提交: ${COMMIT_SHORT}
        
        备注: 此内核适用于crDroid 12 (Android 13)
        ========================================
        EOF
        
        # 打包
        tar -czf $OUTPUT_DIR.tar.gz $OUTPUT_DIR/
        echo "🎉 打包完成: $OUTPUT_DIR.tar.gz ($(du -h $OUTPUT_DIR.tar.gz | cut -f1))"
        echo "包含内容:"
        tar -tzf $OUTPUT_DIR.tar.gz | sed 's/^/  /'

    - name: 上传构建产物
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.run_number }}
        path: |
          ${{ github.workspace }}/*.tar.gz
          ${{ github.workspace }}/build.log
        retention-days: 30

    - name: 上传失败日志
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-${{ github.run_number }}
        path: |
          ${{ github.workspace }}/build.log
          ${{ github.workspace }}/.config
        retention-days: 15
