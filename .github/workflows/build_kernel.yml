name: 构建ASUS ROG Phone 3内核（extcon修复版）

on:
  push:
    branches: [ lineage-23.0 ]
  pull_request:
    branches: [ lineage-23.0 ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'obiwan'
        type: choice
        options:
          - obiwan
          - kona

env:
  KERNEL_NAME: "ASUS_ROG_Phone_3_SM8250"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检查仓库代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 设置编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex gcc-multilib \
          g++-multilib git gnupg gperf imagemagick lib32ncurses-dev \
          lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc \
          zip zlib1g-dev python3 python3-pip unzip wget libncurses-dev bzip2
        pip3 install --user pycryptodome

    - name: 下载编译工具链
      run: |
        echo "=== 下载编译工具链 ==="
        
        # 下载Android NDK
        echo "下载Android NDK r26b..."
        wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        mv android-ndk-r26b ndk
        
        echo "工具链版本:"
        ${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version | head -3

    - name: 设置环境变量
      run: |
        echo "设置编译环境变量..."
        
        NDK_PATH="${{ github.workspace }}/ndk"
        CLANG_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
        
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "PATH=$CLANG_PATH:$PATH" >> $GITHUB_ENV
        
        # 使用LLVM工具链
        echo "CC=clang" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-android21-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=armv7a-linux-androideabi21-" >> $GITHUB_ENV
        
        # 启用LLVM
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: 配置内核
      run: |
        cd ${{ github.workspace }}
        echo "=== 配置内核 ==="
        
        # 清理
        make clean 2>/dev/null || true
        rm -f .config
        
        # 使用基础配置
        echo "应用kona_defconfig..."
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/kona_defconfig
        
        # 合并设备配置
        if [ -f "arch/arm64/configs/vendor/asus/obiwan.config" ]; then
          echo "合并obiwan.config..."
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/asus/obiwan.config
        fi
        
        echo "检查extcon相关配置..."
        grep -E "CONFIG_EXTCON" .config || echo "extcon配置未启用"

    - name: 修复编译配置
      run: |
        cd ${{ github.workspace }}
        echo "=== 修复编译配置 ==="
        
        # 方法1：启用extcon驱动（正确的方法）
        echo "启用extcon驱动..."
        ./scripts/config --enable CONFIG_EXTCON
        
        # 启用一些常用的extcon驱动
        ./scripts/config --module CONFIG_EXTCON_ADC_JACK
        ./scripts/config --module CONFIG_EXTCON_USB_GPIO
        ./scripts/config --module CONFIG_EXTCON_MAX77693
        ./scripts/config --module CONFIG_EXTCON_PALMAS
        
        # 检查并修复头文件路径问题
        echo "检查头文件包含路径..."
        
        # 确保drivers目录在包含路径中
        if [ -f "drivers/base/power/wakeup.c" ]; then
          echo "检查wakeup.c中的包含..."
          head -30 drivers/base/power/wakeup.c | grep -n "extcon"
        fi
        
        # 查看extcon头文件是否存在
        if [ -f "drivers/extcon/extcon.h" ]; then
          echo "✅ extcon.h存在: drivers/extcon/extcon.h"
          ls -la drivers/extcon/extcon.h
        else
          echo "❌ 错误：找不到extcon.h"
          find . -name "extcon.h" -type f
        fi

    - name: 解决头文件路径问题
      run: |
        cd ${{ github.workspace }}
        echo "=== 解决头文件路径问题 ==="
        
        # 检查问题文件
        if grep -q "../../extcon/extcon.h" drivers/base/power/wakeup.c; then
          echo "发现错误的extcon.h包含路径..."
          
          # 备份原文件
          cp drivers/base/power/wakeup.c drivers/base/power/wakeup.c.backup
          
          # 修复包含路径（相对路径改为正确路径）
          sed -i 's|#include <../../extcon/extcon.h>|#include "../../../extcon/extcon.h"|' drivers/base/power/wakeup.c
          
          echo "✅ 修复wakeup.c中的包含路径"
          
          # 验证修复
          echo "修复后的包含行:"
          grep "extcon.h" drivers/base/power/wakeup.c
        else
          echo "wakeup.c中未找到错误的extcon.h包含"
        fi
        
        # 检查其他可能的问题
        echo "检查extcon头文件位置..."
        find . -path "./drivers/extcon/extcon.h" -type f

    - name: 生成最终配置
      run: |
        cd ${{ github.workspace }}
        echo "=== 生成最终配置 ==="
        
        # 生成最终配置（非交互式）
        echo "运行oldconfig..."
        printf '\n'.repeat(10) | make ARCH=arm64 LLVM=1 LLVM_IAS=1 oldconfig 2>&1 | tail -50
        
        echo "最终extcon配置状态:"
        grep -E "CONFIG_EXTCON" .config

    - name: 编译内核
      timeout-minutes: 35
      env:
        ARCH: arm64
        SUBARCH: arm64
      run: |
        cd ${{ github.workspace }}
        echo "=== 开始编译内核 ==="
        
        # 清理输出目录
        rm -rf out 2>/dev/null || true
        mkdir -p out
        
        echo "使用配置:"
        grep "CONFIG_EXTCON" .config
        
        echo "编译命令: make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out -j$(($(nproc) * 2))"
        
        # 开始编译
        time make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out -j$(($(nproc) * 2)) 2>&1 | tee build.log
        
        # 检查编译结果
        echo "=== 编译结果检查 ==="
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "✅ 编译成功！"
          echo "内核文件: out/arch/arm64/boot/Image.gz"
          ls -lh out/arch/arm64/boot/Image.gz
          
          # 检查模块
          MOD_COUNT=$(find out -name "*.ko" -type f 2>/dev/null | wc -l)
          echo "生成的模块数量: $MOD_COUNT"
          
          # 检查extcon模块
          echo "extcon相关模块:"
          find out -name "*extcon*.ko" -type f 2>/dev/null || echo "未找到extcon模块"
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          echo "✅ 编译成功！"
          echo "内核文件: out/arch/arm64/boot/Image"
          ls -lh out/arch/arm64/boot/Image
        else
          echo "❌ 编译失败"
          echo "查看错误日志:"
          tail -200 build.log | grep -B5 -A5 "error\|Error\|ERROR"
          exit 1
        fi

    - name: 打包内核
      if: success()
      run: |
        cd ${{ github.workspace }}
        echo "=== 打包内核文件 ==="
        
        BUILD_DATE=$(date +"%Y%m%d-%H%M")
        OUTPUT_DIR="kernel-asm-${BUILD_DATE}"
        mkdir -p $OUTPUT_DIR
        
        # 复制内核映像
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
          cp out/arch/arm64/boot/Image.gz $OUTPUT_DIR/
          KERNEL_FILE="Image.gz"
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          cp out/arch/arm64/boot/Image $OUTPUT_DIR/
          KERNEL_FILE="Image"
        fi
        
        # 复制DTB文件
        if find out/arch/arm64/boot/dts -name "*.dtb" -type f 2>/dev/null | head -1 > /dev/null; then
          mkdir -p $OUTPUT_DIR/dtb
          find out/arch/arm64/boot/dts -name "*.dtb" -type f -exec cp {} $OUTPUT_DIR/dtb/ \;
        fi
        
        # 复制模块
        if find out -name "*.ko" -type f 2>/dev/null | head -1 > /dev/null; then
          mkdir -p $OUTPUT_DIR/modules
          find out -name "*.ko" -type f -exec cp {} $OUTPUT_DIR/modules/ \;
          MOD_COUNT=$(ls $OUTPUT_DIR/modules/*.ko 2>/dev/null | wc -l)
        else
          MOD_COUNT=0
        fi
        
        # 复制配置文件
        cp .config $OUTPUT_DIR/config
        
        # 创建构建信息
        cat > $OUTPUT_DIR/build-info.txt << EOF
        设备: ASUS ROG Phone 3 (ASUS_I003D)
        代号: obiwan
        平台: kona (SM8250)
        内核版本: $(grep "Linux/arm64" out/include/generated/utsrelease.h 2>/dev/null | cut -d'"' -f2 || echo "未知")
        构建时间: $BUILD_DATE
        工具链: Android NDK r26b + Clang
        文件: $KERNEL_FILE
        模块: $MOD_COUNT
        配置: kona_defconfig + obiwan.config
        修复: 已启用extcon驱动并修复头文件路径
        EOF
        
        # 打包
        tar -czf $OUTPUT_DIR.tar.gz $OUTPUT_DIR/
        echo "✅ 打包完成: $OUTPUT_DIR.tar.gz ($(du -h $OUTPUT_DIR.tar.gz | cut -f1))"

    - name: 上传构建产物
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-asm-${{ github.run_number }}
        path: |
          ${{ github.workspace }}/*.tar.gz
          ${{ github.workspace }}/build.log
        retention-days: 30

    - name: 上传详细日志（失败时）
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-details-${{ github.run_number }}
        path: |
          ${{ github.workspace }}/build.log
          ${{ github.workspace }}/.config
          ${{ github.workspace }}/drivers/base/power/wakeup.c
        retention-days: 15
