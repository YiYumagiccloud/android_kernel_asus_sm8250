name: 构建ASUS ROG Phone 3内核

on:
  push:
    branches: [ lineage-23.0 ]
  pull_request:
    branches: [ lineage-23.0 ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'obiwan'
        type: choice
        options:
          - obiwan
          - kona

env:
  KERNEL_NAME: "ASUS_ROG_Phone_3_SM8250"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检查仓库代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 设置编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex gcc-multilib \
          g++-multilib git gnupg gperf imagemagick lib32ncurses-dev \
          lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc \
          zip zlib1g-dev python3 python3-pip unzip wget
        pip3 install --user pycryptodome

    - name: 下载编译工具链（修复版）
      run: |
        echo "=== 下载编译工具链 ==="
        
        # 方法1：使用预编译的Android NDK（推荐）
        echo "下载Android NDK（包含完整工具链）..."
        NDK_VERSION="r26b"
        wget -q https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip
        unzip -q android-ndk-$NDK_VERSION-linux.zip
        mv android-ndk-$NDK_VERSION ndk
        
        # 设置工具链路径
        export NDK_PATH="${{ github.workspace }}/ndk"
        export CLANG_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export AARCH64_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export ARM32_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
        
        # 创建符号链接以便make能找到
        mkdir -p clang
        ln -sf $CLANG_PATH/clang clang/
        ln -sf $CLANG_PATH/clang++ clang/
        
        mkdir -p aarch64-linux-android-4.9/bin
        ln -sf $AARCH64_PATH/aarch64-linux-android21-clang aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc
        ln -sf $AARCH64_PATH/aarch64-linux-android21-clang++ aarch64-linux-android-4.9/bin/aarch64-linux-android-g++
        
        mkdir -p arm-linux-androideabi-4.9/bin
        ln -sf $ARM32_PATH/armv7a-linux-androideabi21-clang arm-linux-androideabi-4.9/bin/arm-linux-androideabi-gcc
        ln -sf $ARM32_PATH/armv7a-linux-androideabi21-clang++ arm-linux-androideabi-4.9/bin/arm-linux-androideabi-g++
        
        echo "工具链版本信息："
        $CLANG_PATH/clang --version | head -5
        ls -la $CLANG_PATH/clang*
        
        echo "=== 工具链准备完成 ==="

    - name: 设置环境变量
      run: |
        echo "设置编译环境变量..."
        
        # NDK路径
        NDK_PATH="${{ github.workspace }}/ndk"
        
        # 使用NDK中的Clang
        echo "CLANG_PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
        echo "AARCH64_PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
        echo "ARM32_PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
        
        # 更新PATH
        echo "PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:${{ github.workspace }}/clang/bin:${{ github.workspace }}/aarch64-linux-android-4.9/bin:${{ github.workspace }}/arm-linux-androideabi-4.9/bin:$PATH" >> $GITHUB_ENV
        
        # 编译变量 - 使用NDK的Clang
        echo "CC=clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        
        # 对于NDK，CROSS_COMPILE设置不同
        echo "CROSS_COMPILE=aarch64-linux-android21-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=armv7a-linux-androideabi21-" >> $GITHUB_ENV
        
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV

    - name: 准备配置文件
      run: |
        echo "=== 准备内核配置文件 ==="
        cd ${{ github.workspace }}
        
        # 检查配置文件是否存在
        echo "检查配置文件..."
        ls -la arch/arm64/configs/vendor/
        ls -la arch/arm64/configs/vendor/asus/
        
        echo "使用ASUS ROG Phone 3专用配置 (obiwan)"
        # 方法1：直接使用obiwan配置（如果它是完整配置）
        if [ -f "arch/arm64/configs/vendor/asus/obiwan.config" ]; then
          echo "找到obiwan.config，尝试作为基础配置"
          # 先复制一个基础配置
          cp arch/arm64/configs/vendor/kona_defconfig .config
          # 合并设备配置
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/asus/obiwan.config 2>/dev/null || true
        else
          # 如果obiwan.config不存在，使用kona_defconfig
          cp arch/arm64/configs/vendor/kona_defconfig .config
        fi
        
        # 检查.config文件
        echo "生成的.config文件前20行："
        head -20 .config || true

    - name: 编译内核（简化版）
      timeout-minutes: 30
      env:
        ARCH: arm64
        SUBARCH: arm64
      run: |
        cd ${{ github.workspace }}
        echo "=== 开始编译内核 ==="
        
        # 清理
        echo "清理构建目录..."
        make clean 2>/dev/null || true
        rm -rf out 2>/dev/null || true
        
        # 显示工具链信息
        echo "当前工具链："
        which clang
        clang --version || true
        which aarch64-linux-android21-clang || echo "未找到aarch64-linux-android21-clang"
        
        # 方法1：尝试使用传统方式编译
        echo "尝试方法1：使用defconfig编译..."
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android21- CLANG_TRIPLE=aarch64-linux-gnu- vendor/kona_defconfig 2>&1 | tee config.log
        
        # 合并obiwan配置
        if [ -f "arch/arm64/configs/vendor/asus/obiwan.config" ]; then
          echo "合并obiwan配置..."
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/asus/obiwan.config 2>&1 | tee -a config.log
        fi
        
        # 开始编译
        echo "开始内核编译..."
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android21- CLANG_TRIPLE=aarch64-linux-gnu- \
          CC=clang LD=ld.lld -j$(nproc) 2>&1 | tee build.log
        
        # 检查结果
        echo "=== 编译结果 ==="
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "✅ 成功！找到内核文件: arch/arm64/boot/Image.gz"
          ls -lh arch/arm64/boot/
          echo "文件大小: $(du -h arch/arm64/boot/Image.gz | cut -f1)"
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "✅ 成功！找到内核文件: arch/arm64/boot/Image"
          ls -lh arch/arm64/boot/
        else
          echo "❌ 编译失败，未找到内核文件"
          echo "查看错误日志..."
          tail -50 build.log
          echo "尝试方法2：使用LLVM工具链..."
          
          # 方法2：尝试不同配置
          make clean 2>/dev/null || true
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/kona_defconfig 2>&1 | tee config2.log
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) 2>&1 | tee build2.log
          
          if [ -f "arch/arm64/boot/Image.gz" ] || [ -f "arch/arm64/boot/Image" ]; then
            echo "✅ 方法2成功！"
          else
            echo "❌ 所有方法都失败"
            exit 1
          fi
        fi

    - name: 打包生成的文件
      if: success()
      run: |
        cd ${{ github.workspace }}
        echo "=== 打包内核文件 ==="
        
        BUILD_DATE=$(date +"%Y%m%d-%H%M")
        OUTPUT_DIR="kernel-obiwan-$BUILD_DATE"
        mkdir -p $OUTPUT_DIR
        
        # 复制内核文件
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          cp arch/arm64/boot/Image.gz $OUTPUT_DIR/
          echo "复制: Image.gz"
        elif [ -f "arch/arm64/boot/Image" ]; then
          cp arch/arm64/boot/Image $OUTPUT_DIR/
          echo "复制: Image"
        fi
        
        # 复制配置文件
        cp .config $OUTPUT_DIR/config 2>/dev/null || true
        
        # 复制模块（如果有）
        find . -name "*.ko" -type f | head -5 | while read module; do
          mkdir -p $OUTPUT_DIR/modules
          cp "$module" $OUTPUT_DIR/modules/ 2>/dev/null || true
        done
        
        # 创建信息文件
        cat > $OUTPUT_DIR/build-info.txt << EOF
        设备: ASUS ROG Phone 3 (obiwan)
        平台: SM8250 (kona)
        构建时间: $BUILD_DATE
        工具链: Android NDK r26b
        编译器: Clang (来自NDK)
        配置: kona_defconfig + obiwan.config
        仓库: ${{ github.repository }}
        分支: ${{ github.ref_name }}
        提交: ${{ github.sha }}
        EOF
        
        # 打包
        tar -czf $OUTPUT_DIR.tar.gz $OUTPUT_DIR/
        echo "✅ 打包完成: $OUTPUT_DIR.tar.gz"
        ls -lh *.tar.gz

    - name: 上传构建产物
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.run_number }}
        path: |
          ${{ github.workspace }}/kernel-*.tar.gz
          ${{ github.workspace }}/build.log
          ${{ github.workspace }}/config.log
        retention-days: 30

    - name: 上传编译日志（即使失败）
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-logs
        path: |
          ${{ github.workspace }}/build*.log
          ${{ github.workspace }}/config*.log
        retention-days: 15
