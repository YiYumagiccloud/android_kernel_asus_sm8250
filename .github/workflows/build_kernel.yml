name: 构建ASUS ROG Phone 3内核（简易工具链）

on:
  push:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检查仓库代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 设置编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc build-essential ccache libncurses-dev libssl-dev \
          flex bison libelf-dev git wget unzip gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi
          
        # 安装gcc-10（兼容性更好）
        sudo apt-get install -y gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi

    - name: 修复wakeup.c
      run: |
        cd ${{ github.workspace }}
        sed -i 's|#include <../../extcon/extcon.h>|#include "../../../extcon/extcon.h"|' drivers/base/power/wakeup.c

    - name: 编译内核（使用系统GCC）
      timeout-minutes: 60
      run: |
        cd ${{ github.workspace }}
        
        # 清理
        make clean 2>/dev/null || true
        rm -f .config
        
        # 使用系统自带的GCC交叉编译器
        echo "使用系统GCC交叉编译器..."
        
        # 尝试不同的交叉编译器前缀
        COMPILERS=("aarch64-linux-gnu-" "aarch64-linux-gnu-gcc-10" "aarch64-linux-gnu-gcc-9")
        
        for compiler in "${COMPILERS[@]}"; do
          if which ${compiler}gcc >/dev/null 2>&1; then
            echo "使用编译器: ${compiler}"
            export CROSS_COMPILE="${compiler}"
            break
          fi
        done
        
        if [ -z "$CROSS_COMPILE" ]; then
          echo "❌ 未找到合适的交叉编译器"
          exit 1
        fi
        
        # 配置内核
        make ARCH=arm64 $CROSS_COMPILE vendor/kona_defconfig
        
        if [ -f "arch/arm64/configs/vendor/asus/obiwan.config" ]; then
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/asus/obiwan.config
        fi
        
        yes "" | make ARCH=arm64 $CROSS_COMPILE oldconfig
        
        # 开始编译
        echo "开始编译..."
        make ARCH=arm64 $CROSS_COMPILE -j$(nproc) 2>&1 | tee build.log
        
        # 检查结果
        if [ -f "arch/arm64/boot/Image.gz" ] || [ -f "arch/arm64/boot/Image" ]; then
          echo "🎉 编译成功！"
          ls -lh arch/arm64/boot/
        else
          echo "❌ 编译失败"
          tail -50 build.log
          exit 1
        fi

    - name: 上传内核
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          ${{ github.workspace }}/arch/arm64/boot/Image*
          ${{ github.workspace }}/.config
        retention-days: 30
