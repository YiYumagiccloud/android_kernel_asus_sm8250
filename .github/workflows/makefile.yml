# A simple action usage
name: Build Kernel
on:
  workflow_dispatch: # 允许手动触发

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写权限，否则无法发布 Release

    steps:
          - name: Build Kernel
            uses: dabao1955/kernel_build_action@main
            with:
              kernel-url: https://github.com/YiYumagiccloud/android_kernel_asus_sm8250
              kernel-branch: lineage-23.0
              # 刚才合并好的配置文件
              config: vendor/kona-perf_defconfig
              arch: arm64
              aosp-gcc: true
              aosp-clang: true
              android-version: 12
              # 只保留最基础的参数，KCFLAGS 里的宏定义可以删掉了，因为代码已经修好了
              extra-make-args: "LLVM=1 LLVM_IAS=1 KCFLAGS=-w KCPPFLAGS=-w"
              disable-lto: true
              anykernel3: true
              release: true
